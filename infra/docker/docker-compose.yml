# Local offline stack for WATTS — no cloud services needed.
#   postgres        → stands in for the Neon database   (DB_PROVIDER=local)
#   minio           → stands in for Vercel Blob          (STORAGE_PROVIDER=local)
#   drizzle-studio  → schema/data browser, always on     (https://local.drizzle.studio)
#
# Driven from the repo root:  pnpm infra:up | infra:down | infra:reset
# Data lives in named volumes; `pnpm infra:reset` (docker compose down -v) wipes them.

name: watts-local

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watts
    ports:
      - '5432:5432'
    volumes:
      - watts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d watts']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console → http://127.0.0.1:9001
    volumes:
      - watts-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Drizzle Studio — browse the schema + data at https://local.drizzle.studio
  # (the hosted UI connects to this container's published :4983). Always on with
  # the stack; no need to run `pnpm db:studio` in a separate terminal.
  drizzle-studio:
    build: ./drizzle-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/watts
    volumes:
      - ../../apps/ieeeucfcom/src/lib/database:/studio/schema:ro
    ports:
      - '4983:4983'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('net').connect(4983,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # One-shot: create the two buckets and make the public one anonymously readable.
  # Safe to re-run — `mc mb -p` ignores existing buckets.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done
        mc mb -p local/media-public local/resumes-private
        mc anonymous set download local/media-public
        echo 'minio buckets ready'
    restart: 'no'

volumes:
  watts-postgres:
  watts-minio:
