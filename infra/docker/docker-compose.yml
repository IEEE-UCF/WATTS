# Local offline stack for WATTS — no cloud services needed.
#   postgres        → stands in for the Neon database   (DB_PROVIDER=local)
#   minio           → stands in for Vercel Blob          (STORAGE_PROVIDER=local)
#   drizzle-studio  → schema/data browser, always on     (open http://127.0.0.1:3055)
#   minio-init      → one-shot bucket setup (profile "setup", run-and-removed)
#
# Host ports live in one block, 3050–3060 (see infra/docker/README.md):
#   3050 web · 3051 postgres · 3052 minio S3 · 3053 minio console
#   3054 drizzle studio · 3055 drizzle studio redirect
# Container-internal ports stay at image defaults; only the published (left) side moves.
#
# Driven from the repo root:  pnpm infra:up | infra:down | infra:reset
# Data lives in named volumes; `pnpm infra:reset` (docker compose down -v) wipes them.

name: watts-local

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watts
    ports:
      - '3051:5432'
    volumes:
      - watts-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d watts']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":3053"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '3052:9000' # S3 API   → http://127.0.0.1:3052
      - '3053:3053' # web console → http://127.0.0.1:3053
    volumes:
      - watts-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Drizzle Studio — schema + data browser. The UI is hosted by Drizzle and
  # connects back to this container's published :3054; :3055 serves a one-hop
  # redirect so you can just open http://127.0.0.1:3055. Always on with the stack;
  # no need to run `pnpm db:studio` in a separate terminal.
  drizzle-studio:
    build: ./drizzle-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/watts
    volumes:
      - ../../packages/db/src:/studio/schema:ro
    ports:
      - '3054:3054' # drizzle-kit studio (the hosted UI connects here)
      - '3055:3055' # friendly redirect → https://local.drizzle.studio/?host=127.0.0.1&port=3054
    healthcheck:
      test: ['CMD', 'node', '-e', "require('net').connect(3054,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  # One-shot bucket setup. Profiled out of `docker compose up` so it never lingers
  # as an "Exited (0)" container — `pnpm infra:up` invokes it with
  # `docker compose run --rm minio-init`. Safe to re-run (`mc mb -p` is idempotent).
  minio-init:
    image: minio/mc
    profiles: ['setup']
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done
        mc mb -p local/media-public local/resumes-private
        mc anonymous set download local/media-public
        echo 'minio buckets ready'
    restart: 'no'

volumes:
  watts-postgres:
  watts-minio:
