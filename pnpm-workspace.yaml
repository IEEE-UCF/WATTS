# pnpm workspace — the single source of truth for package layout and install rules.
# One lockfile (./pnpm-lock.yaml) covers every package below.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'infra/seed'
  - 'infra/e2e'

# Dependencies allowed to run install/build lifecycle scripts (pnpm blocks the rest
# by default). Managed by `pnpm approve-builds`.
allowBuilds:
  esbuild: true
  react-vertical-timeline-component: true
  sharp: true

# Repo-wide dependency pins.
#   esbuild — carries over from the bot (dev-server advisory).
#
#   The drizzle-orm / pg / @neondatabase/serverless / postgres pins were dropped in
#   Part III: apps/dbot now declares the same exact versions as the website
#   (drizzle-orm 0.44.7, pg 8.16.3) and consumes @watts/db, so pnpm resolves a
#   single instance on its own. `pnpm why -r drizzle-orm` must stay at 1 version.
overrides:
  esbuild: ^0.25.0
