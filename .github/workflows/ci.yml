# Continuous integration.
#
#   verify — typecheck + lint + build every workspace through Turborepo.
#   smoke  — migrate + seed a throwaway Postgres, then run the @watts/core
#            /whois checks against the real schema (catches schema/seed drift).
#   e2e    — build + serve @watts/web against a throwaway Postgres (schema only,
#            no fixtures — the suite tests auth / route-gating / service
#            reachability / the per-role redirect matrix, none of which reads
#            seeded rows) plus a throwaway MinIO for the résumé-export spec
#            (which seeds + removes its own rows). Playwright, both projects:
#            the anonymous specs, plus
#            the `authenticated` project running against a guarded SYNTHETIC
#            session that global-setup.ts mints in the CI database and deletes in
#            teardown (infra/e2e/lib/session.ts) — there is no captured Discord
#            login in CI, and the synthetic session does NOT exercise Discord
#            OAuth (deferred; see infra/e2e/README.md). Screenshots + HTML report
#            as artifacts.
#
# All run on every PR and on push to main. No unit tests yet — Vitest is a
# tracked follow-up. Production migrations live in .github/workflows/deploy.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next.config.ts runs getServerEnv() at load. APP_ENV=local relaxes the
      # auth-secret requirement; DATABASE_URL only needs to be a non-empty string
      # (nothing connects to a database during `next build`). turbo.json forwards
      # both into the build task (globalPassThroughEnv / build.env).
      APP_ENV: local
      DATABASE_URL: postgres://ci:ci@localhost:5432/watts
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Typecheck, lint, build
        run: pnpm exec turbo run typecheck lint build --cache-dir=.turbo/cache

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/watts
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: /whois checks
        run: pnpm --filter @watts/bot check:whois

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run inside the official Playwright image: browsers + every OS library are
    # baked in, so there is no `playwright install --with-deps` / apt-get step to
    # flake on the runner's pre-installed google-chrome repo.
    # KEEP THIS TAG IN LOCKSTEP with @watts/e2e's @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watts
        options: >-
          --health-cmd "pg_isready -U postgres -d watts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `next build` + `next start` both run getServerEnv(); these satisfy the
      # schema. The web server + Playwright run inside this job's container, so
      # they reach the app on localhost; the postgres SERVICE is reached by its
      # label. The Discord / NEXTAUTH values just need to be present.
      # DATABASE_URL host `postgres` is in the synthetic-session host allowlist
      # (infra/e2e/lib/session.ts), so global-setup mints the authenticated
      # fixture here; it can never reach an off-box database.
      APP_ENV: local
      DB_PROVIDER: local
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/watts
      STORAGE_PROVIDER: local
      NEXT_PUBLIC_STORAGE_PROVIDER: local
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_PUBLIC: media-public
      S3_BUCKET_PRIVATE: resumes-private
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-not-a-real-secret
      DISCORD_CLIENT_ID: e2e-client-id
      DISCORD_CLIENT_SECRET: e2e-client-secret
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Playwright browser (no-op if the image already matches)
        run: pnpm --filter @watts/e2e exec playwright install chromium

      - name: Build the web app
        run: pnpm --filter @watts/web build

      - name: Migrate the schema
        run: pnpm db:migrate

      # Object storage for the résumé-export spec. Runs as a process in this job's
      # container (not a `services:` sibling) so S3_ENDPOINT=http://localhost:9000
      # is reachable from both the web server and Playwright. The spec skips itself
      # if this is absent, so it is not fatal — but keep it so the coverage runs.
      - name: Start MinIO
        run: |
          set -e
          URL=https://dl.min.io/server/minio/release/linux-amd64/minio
          curl -fsSL "$URL" -o /usr/local/bin/minio || wget -qO /usr/local/bin/minio "$URL"
          chmod +x /usr/local/bin/minio
          mkdir -p /tmp/minio/resumes-private /tmp/minio/media-public
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup minio server /tmp/minio --address ':9000' --console-address ':9001' \
            > /tmp/minio.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:9000/minio/health/live >/dev/null && { echo "MinIO ready"; exit 0; }
            sleep 1
          done
          echo "MinIO did not become ready"; cat /tmp/minio.log; exit 1

      - name: Playwright suite (anon + synthetic-session authenticated)
        run: pnpm --filter @watts/e2e test

      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            infra/e2e/playwright-report/
            infra/e2e/screenshots/
          retention-days: 14
