# Continuous integration — runs on every PR and every push to main.
#
# One job: install once, then let Turborepo run the task graph. `typecheck`,
# `lint`, and `build` all gate the merge for the whole repo.
#
# No test job yet — the repo has no test runner. Add one here when it does.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # next.config.ts calls getServerEnv() at load; APP_ENV=local relaxes the
      # auth-secret requirement and DATABASE_URL just has to be a non-empty string
      # (nothing connects to a database during `next build`).
      APP_ENV: local
      DATABASE_URL: postgres://ci:ci@localhost:5432/watts
      # Turbo prints hashes, not a progress spinner, in CI.
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, build
        run: pnpm exec turbo run typecheck lint build
