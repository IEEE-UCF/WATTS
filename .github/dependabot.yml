version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # pnpm workspace — one manifest resolution for the whole monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native ("tsgo") compiler preview — not production-ready.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # recharts 3 is a breaking API change; @watts/ui/src/chart.tsx needs a migration first.
      - dependency-name: recharts
        update-types: ["version-update:semver-major"]
      # @mui/icons-material must move together with @mui/material — bump them in one PR by hand.
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
